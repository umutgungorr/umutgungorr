<svg width="900" height="350" viewBox="0 0 900 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>ChronoFlow — günlük zaman bloklama uygulaması</title>
  <desc>ChronoFlow'un yerel öncelikli mimarisini ve günlük zaman çizelgesi arayüzünü anlatan tema uyumlu proje kartı.</desc>
  <style>
    :root { --bg0:#F6F8FA; --bg1:#FFFFFF; --panel:#FFFFFF; --line:#D0D7DE; --grid:#D8DEE4; --fg:#1F2328; --muted:#59636E; --soft:#818B98; }
    @media (prefers-color-scheme: dark) { :root { --bg0:#080A0E; --bg1:#111827; --panel:#161B22; --line:#30363D; --grid:#21262D; --fg:#F0F6FC; --muted:#B1BAC4; --soft:#8B949E; } }
    @media (prefers-reduced-motion: reduce) { .motion { display:none; } }
  </style>
  <defs>
    <linearGradient id="cf-bg" x1="0" y1="0" x2="900" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--bg0)"/>
      <stop offset="1" stop-color="var(--bg1)"/>
    </linearGradient>
    <linearGradient id="cf-accent" x1="44" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF3B6B"/>
      <stop offset="0.52" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#2F81F7"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="348" rx="18" fill="url(#cf-bg)" stroke="var(--line)" stroke-width="2"/>
  <path d="M520 24V326" stroke="var(--line)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <circle cx="47" cy="43" r="4" fill="#3FB950">
      <animate class="motion" attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="62" y="48" fill="var(--soft)" font-size="11" letter-spacing="2">ACTIVE DEVELOPMENT · PRIVATE BETA</text>

    <text x="44" y="112" fill="var(--fg)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">ChronoFlow</text>
    <rect x="44" y="128" width="246" height="3" rx="1.5" fill="url(#cf-accent)"/>

    <text x="44" y="168" fill="var(--muted)" font-size="15">Gününü bloklara ayır. Odağını koru.</text>
    <text x="44" y="195" fill="var(--soft)" font-size="13">Türkçe · local-first · kurulabilir PWA</text>

    <g font-size="10" text-anchor="middle">
      <rect x="44" y="226" width="72" height="28" rx="7" fill="var(--panel)" stroke="var(--line)"/>
      <text x="80" y="244" fill="var(--fg)">NEXT.JS</text>
      <rect x="124" y="226" width="82" height="28" rx="7" fill="var(--panel)" stroke="var(--line)"/>
      <text x="165" y="244" fill="#58A6FF">TYPESCRIPT</text>
      <rect x="214" y="226" width="76" height="28" rx="7" fill="var(--panel)" stroke="var(--line)"/>
      <text x="252" y="244" fill="#3FB950">SUPABASE</text>
      <rect x="298" y="226" width="58" height="28" rx="7" fill="var(--panel)" stroke="var(--line)"/>
      <text x="327" y="244" fill="var(--fg)">VITEST</text>
    </g>

    <text x="44" y="292" fill="var(--soft)" font-size="11">DRAG &amp; DROP  ·  SMART BUFFERS  ·  GOALS  ·  SYNC</text>
    <text x="44" y="317" fill="#58A6FF" font-size="11">PLANLA → ODAKLAN → TAMAMLA</text>
  </g>

  <g transform="translate(550 34)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="0" y="12" fill="var(--soft)" font-size="10" letter-spacing="2">TODAY / TIMELINE</text>
    <text x="278" y="12" text-anchor="end" fill="#58A6FF" font-size="10">LIVE</text>

    <g fill="var(--soft)" font-size="10">
      <text x="0" y="62">08:00</text>
      <text x="0" y="112">10:00</text>
      <text x="0" y="162">12:00</text>
      <text x="0" y="212">14:00</text>
      <text x="0" y="262">16:00</text>
    </g>

    <g stroke="var(--grid)">
      <path d="M48 58H278"/><path d="M48 108H278"/><path d="M48 158H278"/><path d="M48 208H278"/><path d="M48 258H278"/>
      <path d="M48 34V282"/><path d="M105 34V282"/><path d="M162 34V282"/><path d="M219 34V282"/><path d="M278 34V282"/>
    </g>

    <rect x="54" y="69" width="104" height="54" rx="7" fill="#2F81F7" fill-opacity="0.26" stroke="#58A6FF"/>
    <text x="66" y="91" fill="var(--fg)" font-size="11">Deep work</text>
    <text x="66" y="109" fill="var(--soft)" font-size="9">01:30</text>

    <rect x="166" y="86" width="45" height="22" rx="5" fill="#A855F7" fill-opacity="0.28" stroke="#A855F7"/>
    <text x="188.5" y="101" text-anchor="middle" fill="var(--fg)" font-size="8">BUFFER</text>

    <rect x="105" y="142" width="167" height="62" rx="7" fill="#FF3B6B" fill-opacity="0.20" stroke="#FF3B6B"/>
    <text x="119" y="166" fill="var(--fg)" font-size="11">Build ChronoFlow</text>
    <text x="119" y="186" fill="var(--soft)" font-size="9">02:00 · PRODUCT</text>

    <rect x="54" y="224" width="94" height="38" rx="7" fill="#3FB950" fill-opacity="0.18" stroke="#3FB950"/>
    <text x="66" y="247" fill="var(--fg)" font-size="10">Review goals</text>

    <path d="M48 131H278" stroke="#FF3B6B" stroke-width="2">
      <animate class="motion" attributeName="d" values="M48 131H278;M48 139H278;M48 131H278" dur="4s" repeatCount="indefinite"/>
    </path>
    <circle cx="48" cy="131" r="4" fill="#FF3B6B">
      <animate class="motion" attributeName="cy" values="131;139;131" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

