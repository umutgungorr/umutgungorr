<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Umut Güngör — whoami --signal</title>
  <desc>Umut Güngör'ün mühendislik kimliğini, vizyonunu ve aktif ürünlerini gösteren terminal kartı.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) { .motion { display:none; } }
  </style>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="898" height="258" rx="14" fill="#0A0C10" stroke="#22252D" stroke-width="1.5"/>
  <path d="M1 38H899" stroke="#1F242C"/>
  <path d="M15 1H885A14 14 0 0 1 899 15V38H1V15A14 14 0 0 1 15 1Z" fill="#12151C"/>

  <!-- Window Buttons -->
  <circle cx="22" cy="19" r="4.5" fill="#FF5F57"/>
  <circle cx="38" cy="19" r="4.5" fill="#FEBC2E"/>
  <circle cx="54" cy="19" r="4.5" fill="#28C840"/>
  <text x="450" y="23" text-anchor="middle" fill="#6E7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="0.5">whoami.sh</text>

  <!-- Terminal Content Lines -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <!-- 01 Prompt -->
    <text x="28" y="70" fill="#6E7681">01</text>
    <text x="68" y="70" fill="#58A6FF" font-weight="600">$</text>
    <text x="86" y="70" fill="#F0F6FC" font-weight="600">whoami --signal</text>

    <!-- 02 Role -->
    <text x="28" y="104" fill="#6E7681">02</text>
    <text x="68" y="104" fill="#8B949E">role</text>
    <text x="170" y="104" fill="#F0F6FC">Product-minded Software Engineer</text>

    <!-- 03 Craft -->
    <text x="28" y="138" fill="#6E7681">03</text>
    <text x="68" y="138" fill="#8B949E">craft</text>
    <text x="170" y="138" fill="#F0F6FC">Clear flows · typed systems · tested logic</text>

    <!-- 04 Focus -->
    <text x="28" y="172" fill="#6E7681">04</text>
    <text x="68" y="172" fill="#8B949E">focus</text>
    <text x="170" y="172" fill="#58A6FF">Zero-dependency CLI tools</text>
    <text x="382" y="172" fill="#8B949E">&amp; modern web systems</text>

    <!-- 05 Shipping -->
    <text x="28" y="206" fill="#6E7681">05</text>
    <text x="68" y="206" fill="#8B949E">shipping</text>
    <text x="170" y="206" fill="#3FB950" font-weight="600">PortTree</text>
    <text x="246" y="206" fill="#8B949E">·</text>
    <text x="262" y="206" fill="#F59E0B" font-weight="600">LogShrink</text>
    <text x="346" y="206" fill="#8B949E">·</text>
    <text x="362" y="206" fill="#BC8CFF" font-weight="600">TokenGuard</text>
    <text x="454" y="206" fill="#8B949E">·</text>
    <text x="470" y="206" fill="#388BFD" font-weight="600">RepoPulse</text>

    <!-- 06 Cursor -->
    <text x="28" y="238" fill="#6E7681">06</text>
    <rect class="motion" x="68" y="225" width="8" height="15" rx="1" fill="#58A6FF">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.45;.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>