<svg width="100%" height="auto" viewBox="0 0 440 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>⏱️ ChronoFlow — Umut Güngör</title>
  
  <!-- Outer Card Frame (with built-in 4px margin so adjacent cards have clean breathing room) -->
  <rect x="4" y="4" width="432" height="172" rx="12" fill="#0A0C10" stroke="#22252D" stroke-width="1.5" />

  <!-- Left Accent Bar -->
  <rect x="4" y="16" width="4.5" height="148" rx="2" fill="#6366F1" />

  <!-- Row 1: Category Eyebrow Pill on Left, Badges on Right -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Category Pill -->
    <rect x="22" y="16" width="95" height="20" rx="4" fill="#1E1B4B" stroke="#4338CA" stroke-width="1" />
    <text x="69.5" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#A5B4FC" letter-spacing="0.5">LOCAL-FIRST</text>

    <!-- Badge 1 -->
    <rect x="271" y="16" width="72" height="20" rx="4" fill="#1F2937" stroke="#374151" stroke-width="1" />
    <text x="307.0" y="30" text-anchor="middle" font-size="10" font-weight="600" fill="#D1D5DB">REACT 19</text>

    <!-- Badge 2 -->
    <rect x="351" y="16" width="65" height="20" rx="4" fill="#1F2937" stroke="#374151" stroke-width="1" />
    <text x="383.5" y="30" text-anchor="middle" font-size="10" font-weight="600" fill="#6366F1">OFFLINE</text>
  </g>

  <!-- Row 2: Prominent Title with 100% Zero-Collision Breathing Room -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="22" y="66" font-size="18.5" font-weight="700" fill="#FFFFFF">⏱️ ChronoFlow</text>
  </g>

  <!-- Row 3: Value Proposition & Description -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="22" y="89" font-size="12" font-weight="600" fill="#F3F4F6">Daily time-blocking &amp; cognitive focus scheduler</text>
    <text x="22" y="108" font-size="11" font-weight="400" fill="#9CA3AF">Structured flow planning with client state machines &amp; zero cloud lock-in.</text>
  </g>

  <!-- Row 4: Terminal Command Runner Bar -->
  <rect x="20" y="126" width="400" height="36" rx="6" fill="#11141B" stroke="#1F242D" stroke-width="1" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <text x="32" y="148">
      <tspan fill="#6366F1" font-weight="600">⚡ </tspan>
      <tspan fill="#E5E7EB">React 19 · TypeScript · Supabase</tspan>
    </text>
    <text x="406" y="148" text-anchor="end" fill="#6B7280" font-size="10.5">arch</text>
  </g>
</svg>