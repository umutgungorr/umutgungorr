<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Umut Güngör — whoami --signal</title>
  <desc>Umut Güngör'ün mühendislik kimliğini, vizyonunu ve aktif ürünlerini gösteren açık tema terminal kartı.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) { .motion { display:none; } }
  </style>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="898" height="258" rx="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
  <path d="M1 38H899" stroke="#D0D7DE"/>
  <path d="M15 1H885A14 14 0 0 1 899 15V38H1V15A14 14 0 0 1 15 1Z" fill="#EAEEF2"/>

  <!-- Window Buttons -->
  <circle cx="22" cy="19" r="4.5" fill="#FF5F57"/>
  <circle cx="38" cy="19" r="4.5" fill="#FEBC2E"/>
  <circle cx="54" cy="19" r="4.5" fill="#28C840"/>
  <text x="450" y="23" text-anchor="middle" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="0.5">whoami.sh</text>

  <!-- Terminal Content Lines -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <!-- 01 Prompt -->
    <text x="28" y="70" fill="#818B98">01</text>
    <text x="68" y="70" fill="#0969DA" font-weight="600">$</text>
    <text x="86" y="70" fill="#1F2328" font-weight="600">whoami --signal</text>

    <!-- 02 Role -->
    <text x="28" y="104" fill="#818B98">02</text>
    <text x="68" y="104" fill="#59636E">role</text>
    <text x="170" y="104" fill="#1F2328">Product-minded Software Engineer</text>

    <!-- 03 Craft -->
    <text x="28" y="138" fill="#818B98">03</text>
    <text x="68" y="138" fill="#59636E">craft</text>
    <text x="170" y="138" fill="#1F2328">Clear flows · typed systems · tested logic</text>

    <!-- 04 Focus -->
    <text x="28" y="172" fill="#818B98">04</text>
    <text x="68" y="172" fill="#59636E">focus</text>
    <text x="170" y="172" fill="#0969DA">Zero-dependency CLI tools</text>
    <text x="382" y="172" fill="#59636E">&amp; modern web systems</text>

    <!-- 05 Shipping -->
    <text x="28" y="206" fill="#818B98">05</text>
    <text x="68" y="206" fill="#59636E">shipping</text>
    <text x="170" y="206" fill="#1A7F37" font-weight="600">PortTree</text>
    <text x="246" y="206" fill="#818B98">·</text>
    <text x="262" y="206" fill="#9A6700" font-weight="600">LogShrink</text>
    <text x="346" y="206" fill="#818B98">·</text>
    <text x="362" y="206" fill="#8250DF" font-weight="600">TokenGuard</text>
    <text x="454" y="206" fill="#818B98">·</text>
    <text x="470" y="206" fill="#0969DA" font-weight="600">RepoPulse</text>

    <!-- 06 Cursor -->
    <text x="28" y="238" fill="#818B98">06</text>
    <rect class="motion" x="68" y="225" width="8" height="15" rx="1" fill="#0969DA">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.45;.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>