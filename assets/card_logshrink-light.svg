<svg width="100%" height="auto" viewBox="0 0 440 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>⚡ LogShrink — Umut Güngör</title>
  <!-- Outer Card Frame -->
  <rect x="1" y="1" width="438" height="158" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5" />

  <!-- Left Accent Bar -->
  <rect x="1" y="12" width="4" height="136" rx="2" fill="#F59E0B" />

  <!-- Header Row: Title &amp; Badges -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="18" y="32" font-size="16.5" font-weight="700" fill="#1F2328">⚡ LogShrink</text>

    <!-- Category Pill -->
    <rect x="135" y="17" width="46" height="20" rx="4" fill="#451A03" stroke="#D97706" stroke-width="1" />
    <text x="158.0" y="31" text-anchor="middle" font-size="10" font-weight="700" fill="#FCD34D" letter-spacing="0.5">LOGS</text>

    <!-- Badge 1 -->
    <rect x="298" y="17" width="58" height="20" rx="4" fill="#EAEEF2" stroke="#D0D7DE" stroke-width="1" />
    <text x="327.0" y="31" text-anchor="middle" font-size="10" font-weight="600" fill="#57606A">v1.0.1</text>

    <!-- Badge 2 -->
    <rect x="364" y="17" width="58" height="20" rx="4" fill="#EAEEF2" stroke="#D0D7DE" stroke-width="1" />
    <text x="393.0" y="31" text-anchor="middle" font-size="10" font-weight="600" fill="#F59E0B">0 DEPS</text>
  </g>

  <!-- Value Proposition &amp; Fix -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="18" y="60" font-size="12" font-weight="600" fill="#24292F">Terminal stream noise filter &amp; live deduplicator</text>
    <text x="18" y="80" font-size="11" font-weight="400" fill="#57606A">Deduplicates polling floods into [x480 suppressed]; auto-boxes errors.</text>
  </g>

  <!-- Interactive Terminal Run Bar -->
  <rect x="18" y="104" width="404" height="36" rx="6" fill="#EAEEF2" stroke="#D0D7DE" stroke-width="1" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <text x="30" y="126">
      <tspan fill="#F59E0B" font-weight="600">$ </tspan>
      <tspan fill="#1F2328">uvx logshrink -- npm test</tspan>
    </text>
    <text x="410" y="126" text-anchor="end" fill="#6B7280" font-size="10.5">↵ run</text>
  </g>
</svg>