<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">CVera</title>
  <desc id="desc">Deterministic and privacy-first résumé to job description matcher.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="0.52" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#f778ba"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .muted{fill:#57606a}.soft{fill:#424a53}.white{fill:#1f2328}
    </style>
  </defs>

  <rect width="1200" height="460" rx="24" fill="#f6f8fa"/>
  <rect x="1" y="1" width="1198" height="458" rx="23" fill="none" stroke="#d0d7de" stroke-width="2"/>
  <path d="M704 30V430" stroke="#d8dee4"/>
  <circle cx="60" cy="59" r="5" fill="#3fb950"/>
  <text x="76" y="63" class="mono muted" font-size="13" letter-spacing="2">PUBLIC MVP · ACTIVE DEVELOPMENT</text>

  <text x="58" y="148" class="sans white" font-size="64" font-weight="760" letter-spacing="-2">CVera</text>
  <rect x="58" y="166" width="250" height="4" rx="2" fill="url(#accent)"/>
  <text x="58" y="213" class="mono soft" font-size="18">CV’ni hedef rolle karşılaştır.</text>
  <text x="58" y="242" class="mono soft" font-size="18">Eksik teknik sinyalleri gör.</text>
  <text x="58" y="278" class="mono muted" font-size="14">TÜRKÇE + ENGLISH · DETERMINISTIC · PRIVACY-FIRST</text>

  <g class="mono" font-size="12" font-weight="700">
    <rect x="58" y="310" width="108" height="34" rx="8" fill="#eef2f6" stroke="#d0d7de"/>
    <text x="78" y="331" fill="#58a6ff">NEXT.JS 16</text>
    <rect x="177" y="310" width="101" height="34" rx="8" fill="#eef2f6" stroke="#d0d7de"/>
    <text x="196" y="331" fill="#79c0ff">REACT 19</text>
    <rect x="289" y="310" width="104" height="34" rx="8" fill="#eef2f6" stroke="#d0d7de"/>
    <text x="309" y="331" fill="#d2a8ff">PDF/DOCX</text>
    <rect x="404" y="310" width="116" height="34" rx="8" fill="#eef2f6" stroke="#d0d7de"/>
    <text x="422" y="331" fill="#7ee787">NODE TEST</text>
  </g>

  <text x="58" y="397" class="mono muted" font-size="12" letter-spacing="1.2">PARSE  /  VALIDATE  /  MATCH  /  EXPLAIN</text>
  <text x="58" y="425" class="mono" fill="#58a6ff" font-size="13" font-weight="700">YÜKLE · KARŞILAŞTIR · İYİLEŞTİR</text>

  <g transform="translate(750 54)">
    <text x="0" y="0" class="mono muted" font-size="12" letter-spacing="2">MATCH PIPELINE / PREVIEW</text>
    <g transform="translate(0 36)">
      <rect width="168" height="232" rx="14" fill="url(#panel)" stroke="#d0d7de"/>
      <rect x="18" y="18" width="44" height="9" rx="4.5" fill="#2f81f7"/>
      <text x="18" y="50" class="mono white" font-size="13" font-weight="700">CV DOCUMENT</text>
      <rect x="18" y="70" width="118" height="6" rx="3" fill="#d0d7de"/>
      <rect x="18" y="86" width="96" height="6" rx="3" fill="#d8dee4"/>
      <rect x="18" y="113" width="128" height="6" rx="3" fill="#d0d7de"/>
      <rect x="18" y="129" width="107" height="6" rx="3" fill="#d8dee4"/>
      <rect x="18" y="161" width="57" height="23" rx="6" fill="#ddf4ff" stroke="#2f81f7"/>
      <text x="30" y="176" class="mono" fill="#79c0ff" font-size="10">REACT</text>
      <rect x="82" y="161" width="65" height="23" rx="6" fill="#ddf4ff" stroke="#2f81f7"/>
      <text x="94" y="176" class="mono" fill="#79c0ff" font-size="10">NEXT.JS</text>
      <rect x="18" y="192" width="74" height="23" rx="6" fill="#fbefff" stroke="#a371f7"/>
      <text x="30" y="207" class="mono" fill="#d2a8ff" font-size="10">TYPESCRIPT</text>
    </g>
    <g transform="translate(194 116)">
      <circle cx="28" cy="28" r="26" fill="#eef2f6" stroke="#d0d7de"/>
      <path d="M17 28h22M32 21l7 7-7 7" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(264 36)">
      <rect width="168" height="232" rx="14" fill="url(#panel)" stroke="#d0d7de"/>
      <rect x="18" y="18" width="44" height="9" rx="4.5" fill="#f778ba"/>
      <text x="18" y="50" class="mono white" font-size="13" font-weight="700">TARGET ROLE</text>
      <rect x="18" y="70" width="124" height="6" rx="3" fill="#d0d7de"/>
      <rect x="18" y="86" width="90" height="6" rx="3" fill="#d8dee4"/>
      <text x="18" y="124" class="mono muted" font-size="10">MATCHED SIGNALS</text>
      <circle cx="23" cy="143" r="4" fill="#3fb950"/>
      <text x="35" y="147" class="mono soft" font-size="11">React · Next.js</text>
      <circle cx="23" cy="169" r="4" fill="#3fb950"/>
      <text x="35" y="173" class="mono soft" font-size="11">TypeScript</text>
      <text x="18" y="203" class="mono muted" font-size="10">GAP SIGNAL</text>
      <circle cx="23" cy="221" r="4" fill="#f778ba" filter="url(#glow)"/>
      <text x="35" y="225" class="mono" fill="#9a2f6f" font-size="11">Docker</text>
    </g>
    <g transform="translate(0 296)">
      <rect width="432" height="72" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      <circle cx="28" cy="26" r="5" fill="#3fb950"/>
      <text x="43" y="30" class="mono white" font-size="12" font-weight="700">EXPLAINABLE RESULT</text>
      <text x="20" y="53" class="mono muted" font-size="11">Matched evidence and missing signals stay traceable.</text>
    </g>
  </g>
</svg>

